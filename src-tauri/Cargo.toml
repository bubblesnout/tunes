[package]
name = "tunes"
version = "0.1.0"
description = "Tunes - a gamepad-first Navidrome player"
edition = "2021"

[lib]
name = "tunes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs"] }
md5 = "0.7"
rand = "0.8"
parking_lot = "0.12"
dirs = "5"
anyhow = "1"
log = "0.4"
crossbeam-channel = "0.5"
symphonia = { version = "0.5", features = ["all"] }
cpal = "0.15"
rubato = "0.15"
souvlaki = "0.7"
keyring = { version = "3", features = ["windows-native", "sync-secret-service", "crypto-rust"] }
urlencoding = "2"
futures = "0.3"
crc32fast = "1"

[target.'cfg(windows)'.dependencies]
# XInput backend: the default (Windows.Gaming.Input) can detect pads but deliver no input to desktop apps.
gilrs = { version = "0.11", default-features = false, features = ["xinput"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry"] }

[target.'cfg(not(windows))'.dependencies]
gilrs = "0.11"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
